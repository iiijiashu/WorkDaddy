name: Build & Verify Windows Release

# 触发方式（任选其一都会跑这套打包+验证）：
#   - 推 v* 标签（正式发版）
#   - 手动触发（workflow_dispatch，可传版本号）
#   - 推 master/main（可选，防回归）
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.4），留空则从代码读取'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build zip + verify
    runs-on: windows-latest   # IExpress 是真 GUI，必须在 Windows runner 上打包
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验 CRLF（cmd 必须 CRLF，否则 cmd.exe 解析括号块会失败）
        shell: bash
        run: |
          for f in scripts/*.cmd; do
            if ! grep -q $'\r' "$f"; then
              echo "::error::$f 不是 CRLF，无法在 Windows 使用，请转换"
              exit 1
            fi
          done
          echo "所有 .cmd 均为 CRLF ✓"

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(grep -o "DAEMON_VERSION = '[^']*'" scripts/daemon.js | head -1 | cut -d"'" -f2)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "检测到版本: $VER"

      - name: 打包内置资产 builtin（build-win-zip.sh 需要）
        shell: bash
        run: |
          SRC="WorkDaddy.app/Contents/Resources/scripts/builtin"
          if [ -d "$SRC" ]; then
            cp -R "$SRC/." scripts/builtin/
            echo "已复制 builtin 资产"
          else
            echo "警告: 未找到 builtin，面板将无官方壁纸（不影响安装功能）"
          fi

      - name: 生成 Windows zip
        shell: bash
        run: bash scripts/build-win-zip.sh

      - name: 列出产物
        shell: bash
        run: ls -lh release/

      - name: 解压并验收最终 Windows zip
        shell: powershell
        run: |
          $zip = "release/WorkDaddy-${{ steps.ver.outputs.version }}-win64.zip"
          $dst = Join-Path $env:RUNNER_TEMP 'workdaddy-release-check'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          if (-not (Test-Path (Join-Path $dst 'Install-WorkDaddy.cmd'))) { throw 'zip 缺少顶层 Install-WorkDaddy.cmd' }
          if (-not (Test-Path (Join-Path $dst 'Start-WorkDaddy.cmd'))) { throw 'zip 缺少顶层 Start-WorkDaddy.cmd' }
          if (-not (Test-Path (Join-Path $dst 'launcher.cmd'))) { throw 'zip 缺少 1.0.4 更新兼容入口 launcher.cmd' }
          if (-not (Test-Path (Join-Path $dst 'scripts\launch-hidden.vbs'))) { throw 'zip 缺少静默启动器' }
          cmd /d /c "call `"$dst\scripts\verify-win.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "release verify failed: $LASTEXITCODE" }

      - name: 上传 Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: workdaddy-win64
          path: release/WorkDaddy-*-win64.zip

      # ---- 打 tag 时挂到 GitHub Release；兼容 v1.0.5 与 1.0.5 两种 tag 风格 ----
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/WorkDaddy-*-win64.zip
          generate_release_notes: true
